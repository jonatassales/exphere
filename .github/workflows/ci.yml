name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native package and Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.1"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: packages/cli/go.mod
          cache: false

      - name: Install pinned workspace tools
        run: npm install --global pnpm@12.4.2

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Check TypeScript and Go
        run: pnpm typecheck

      - name: Build packages and website
        run: pnpm build

      - name: Install the existing shader test browser
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run package and disposable hook contracts
        run: pnpm test
